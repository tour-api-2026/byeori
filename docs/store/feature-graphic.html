<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Pretendard'; font-weight:400;
    src:url('../../apps/app/assets/fonts/Pretendard-Regular.ttf'); }
  @font-face { font-family:'Pretendard'; font-weight:600;
    src:url('../../apps/app/assets/fonts/Pretendard-SemiBold.ttf'); }
  @font-face { font-family:'Pretendard'; font-weight:800;
    src:url('../../apps/app/assets/fonts/Pretendard-Bold.ttf'); }

  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:500px; overflow:hidden; }
  body {
    font-family:'Pretendard',sans-serif;
    background:
      radial-gradient(720px 420px at 78% 52%, rgba(38,49,118,.16) 0%, rgba(38,49,118,0) 62%),
      linear-gradient(128deg,#F4F0E6 0%,#EBE5D6 46%,#DED5C0 100%);
    position:relative;
  }

  /* 전통 문양을 연상시키는 아주 옅은 격자 — 배경이 비지 않게만 */
  .grid { position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(38,49,118,.045) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, rgba(38,49,118,.045) 0 1px, transparent 1px 34px);
    mask-image: radial-gradient(560px 380px at 22% 50%, #000 0%, transparent 78%);
  }
  .sweep { position:absolute; left:-120px; bottom:-190px; width:640px; height:640px;
    border-radius:50%; border:1.5px solid rgba(38,49,118,.10); }
  .sweep.b { left:-190px; bottom:-260px; width:780px; height:780px; }

  .wrap { position:relative; height:100%; display:flex; align-items:center; }

  /* ── 좌측 카피 ── */
  .left { width:474px; padding-left:66px; }
  .brandrow { display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  .icon { width:66px; height:66px; border-radius:19px; object-fit:cover;
    box-shadow:0 8px 20px rgba(31,38,76,.18); }
  .name { font-weight:800; font-size:62px; color:#263176; letter-spacing:3px; line-height:1; }
  .tag { font-weight:800; font-size:27px; color:#1A1A1F; line-height:1.42; letter-spacing:-.4px; }
  .tag em { font-style:normal; color:#263176; }
  .sub { margin-top:12px; font-weight:500; font-size:15.5px; color:#5B5F66; line-height:1.6; }

  .chips { display:flex; gap:8px; margin-top:22px; flex-wrap:wrap; }
  .chip { font-weight:600; font-size:13.5px; color:#263176;
    background:rgba(255,255,255,.82); border:1px solid rgba(38,49,118,.16);
    border-radius:999px; padding:8px 15px; white-space:nowrap; }
  .chip.hot { color:#fff; background:#263176; border-color:#263176; }

  /* ── 우측 단말 ── */
  .phones { position:absolute; left:498px; top:0; width:526px; height:500px; }
  .ph { position:absolute; border-radius:30px; background:#0E1330;
    padding:7px; box-shadow:0 24px 48px rgba(23,29,66,.30); }
  .ph img { display:block; border-radius:24px; width:100%; height:100%; object-fit:cover;
    object-position:top center; }

  /* 겹쳐 배치 — 가운데를 가장 크고 앞에 */
  .p1 { width:180px; height:366px; left:6px;   top:70px; transform:rotate(-9deg);   z-index:1; }
  .p2 { width:206px; height:418px; left:160px; top:41px; transform:rotate(-1.5deg); z-index:3; }
  .p3 { width:180px; height:366px; left:322px; top:66px; transform:rotate(7deg);    z-index:2; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="sweep"></div>
  <div class="sweep b"></div>

  <div class="wrap">
    <div class="left">
      <div class="brandrow">
        <img class="icon" src="../../apps/app/assets/images/icon.png" alt="">
        <div class="name">벼리</div>
      </div>
      <div class="tag">흩어진 <em>전통 여행 정보</em>를<br>하나로 엮다</div>
      <div class="sub">고궁·국악·축제부터 한옥 카페까지<br>공공데이터로 엮은 여행 큐레이션</div>
      <div class="chips">
        <span class="chip hot">전통 행사 1,100+</span>
        <span class="chip">명소 2만 9천+</span>
        <span class="chip">나만의 루트</span>
      </div>
    </div>

    <div class="phones">
      <div class="ph p1"><img src="screenshots/02-traditional-events.png" alt=""></div>
      <div class="ph p2"><img src="screenshots/01-home.png" alt=""></div>
      <div class="ph p3"><img src="screenshots/03-venue-detail.png" alt=""></div>
    </div>
  </div>
</body>
</html>
