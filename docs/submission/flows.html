<!doctype html><html lang="ko"><head><meta charset="utf-8">
<style>
  @font-face{font-family:'P';font-weight:400;src:url('../../apps/app/assets/fonts/Pretendard-Regular.ttf')}
  @font-face{font-family:'P';font-weight:600;src:url('../../apps/app/assets/fonts/Pretendard-SemiBold.ttf')}
  @font-face{font-family:'P';font-weight:800;src:url('../../apps/app/assets/fonts/Pretendard-Bold.ttf')}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'P',sans-serif;background:#fff;color:#1A1A1F}
  .sheet{width:1400px;padding:38px 44px 44px;background:#fff}
  .ttl{font-size:27px;font-weight:800;color:#263176;margin-bottom:4px}
  .sub{font-size:14.5px;color:#5B5F66;margin-bottom:26px;line-height:1.55}
  .row{display:flex;align-items:stretch;gap:0}
  .step{flex:1;min-width:0}
  .card{height:100%;border:1.6px solid #D8DCEA;border-radius:13px;padding:15px 16px;background:#FAFBFF;
        display:flex;flex-direction:column;gap:7px}
  .card.act{background:#263176;border-color:#263176}
  .card.act .nm,.card.act .ds{color:#fff}
  .card.act .tag{background:rgba(255,255,255,.19);color:#fff;border-color:transparent}
  .card.dat{background:#FFF7EC;border-color:#E8CBA0}
  .no{font-size:11px;font-weight:800;color:#8A8FA6;letter-spacing:.6px}
  .card.act .no{color:#B9C0E8}
  .card.dat .no{color:#B08A50}
  .nm{font-size:16.5px;font-weight:800;line-height:1.3}
  .ds{font-size:13px;color:#4A4E5A;line-height:1.55}
  .tag{align-self:flex-start;margin-top:auto;font-size:11.5px;font-weight:600;color:#263176;
       background:#E7EAF6;border:1px solid #CBD2EC;border-radius:999px;padding:3px 9px}
  .card.dat .tag{background:#F6E4C6;border-color:#E0C093;color:#7A5A22}
  .arw{flex:0 0 34px;display:flex;align-items:center;justify-content:center;color:#A9B0C8;font-size:21px}
  .note{margin-top:22px;font-size:12.5px;color:#6B7080;line-height:1.65;
        border-left:3px solid #263176;padding-left:12px}
  .note b{color:#263176}
</style></head><body>
<div class="sheet" id="s">
  <div class="ttl" id="t"></div>
  <div class="sub" id="u"></div>
  <div class="row" id="r"></div>
  <div class="note" id="n"></div>
</div>
<script>
const FLOWS = {
 f1:{t:"기능 1 · 전통 테마 행사 큐레이션",
   u:"공연·축제 데이터에서 전통을 주제로 한 행사만 자동 분류해 별도 제공한다. 장르 코드만으로는 분류가 어려워 제목·주최기관을 함께 판별한다.",
   s:[["01","공연·축제 수집","한국관광공사 OpenAPI(searchFestival2)와 KOPIS에서 행사 정보를 받아온다","데이터 수집",1],
      ["02","전통 여부 판별","장르 코드(국악·전통무용·마당극)와 제목·주최기관 키워드를 함께 검사","서버 처리",0],
      ["03","전통 행사 저장","traditional 플래그를 부여해 저장 (현재 1,340건)","DB",1],
      ["04","목록 제공","진행 중 → 예정 순으로 정렬, 포스터 있는 행사 우선 노출","API",0],
      ["05","사용자 탐색","홈 '전통 테마 행사' 섹션 및 전체보기 화면에서 확인","화면",0]],
   n:"<b>핵심</b> · 관광공사 축제 데이터와 KOPIS 공연 데이터를 하나의 기준으로 통합 분류해, 흩어져 있던 전통 행사 정보를 한 곳에서 볼 수 있게 했다."},
 f2:{t:"기능 2 · 지도 기반 주변 탐색",
   u:"현재 위치를 중심으로 주변 관광지·문화시설·공연장·음식점을 지도에 표시한다. 위치 정보는 기기 안에서만 사용하고 서버로 전송하지 않는다.",
   s:[["01","위치 권한 요청","허용 시 현재 좌표 획득, 거부해도 서울 기본 중심으로 이용 가능","화면",0],
      ["02","지도 표시","카카오맵에 현재 위치 중심으로 지도를 그린다","외부 API",0],
      ["03","실시간 주변 조회","지도가 멈춘 좌표·반경으로 locationBasedList2를 호출해 그 영역의 장소만 받아온다","공사 OpenAPI",0],
      ["04","마커 표시","카테고리 이모지 핀으로 지도에 표시, 한복 혜택 장소는 강조","화면",0],
      ["05","상세 이동","핀을 누르면 요약 카드 → 장소 상세 화면으로 이동","화면",0]],
   n:"<b>실시간 활용</b> · 전국 데이터를 미리 받아두지 않고, 보고 있는 영역만 그때그때 호출한다. 좌표는 약 100m 단위로 반올림해 같은 화면을 다시 부르지 않는다. <b>출처</b> · 장소 정보는 ⓒ한국관광공사."},
 f3:{t:"기능 3 · 장소 상세 정보",
   u:"화면을 열 때 한국관광공사 OpenAPI를 실시간 조회해 최신 운영 정보를 보여주고, 그 장소에서 진행 중인 행사를 함께 표시한다.",
   s:[["01","장소 선택","지도·목록·검색 어디서든 장소를 선택","화면",0],
      ["02","실시간 조회","detailCommon2·detailIntro2 호출 — 소개글·이용시간·휴무일·문의처·주차","공사 OpenAPI",0],
      ["03","연관 행사 결합","같은 장소에서 진행 중인 공연·축제를 좌표·장소 ID로 연결","서버 처리",0],
      ["04","이용자 정보 결합","평점·리뷰·방문자 코멘트 태그를 함께 조회","DB",1],
      ["05","화면 구성","한복 혜택·출처 표기와 함께 한 화면에 표시","화면",0]],
   n:"<b>실시간 활용</b> · 상세를 열 때마다 공사 API를 2건 호출한다(평균 0.9초). 지연·실패 시에는 저장된 정보로 대체해 화면이 멈추지 않는다."},
 f4:{t:"기능 4 · 여행 일정 만들기",
   u:"가고 싶은 곳을 담아 하루 일정을 구성하고 실제 이동 경로와 소요 시간을 확인한다.",
   s:[["01","일정 생성","제목과 여행 날짜를 입력하거나 추천 코스를 그대로 복사","화면",0],
      ["02","방문지 추가","장소 상세의 '내 여행에 추가'로 방문지를 담는다","화면",0],
      ["03","순서 정리","방문 순서와 예정 시각·메모를 설정","화면",0],
      ["04","경로 탐색","카카오모빌리티 길찾기로 방문지를 잇는 경로 계산","외부 API",0],
      ["05","지도 확인","구간별 색상으로 경로를 그리고 총 거리·소요 시간 표시","화면",0]],
   n:"<b>검증</b> · 실제 호출 확인 — 2개 방문지 기준 총거리 1,044m · 소요 382초 정상 반환."},
 f5:{t:"기능 5 · 리뷰와 이용자 보호",
   u:"방문 후기를 남기고, 부적절한 콘텐츠는 신고하거나 특정 이용자를 차단할 수 있다.",
   s:[["01","리뷰 작성","별점과 후기를 남긴다 (로그인 필요)","화면",0],
      ["02","평점 재계산","장소의 평균 평점과 리뷰 수를 즉시 다시 계산","서버 처리",0],
      ["03","신고","부적절한 리뷰·장소를 사유와 함께 신고 (중복·본인 신고 차단)","API",0],
      ["04","차단","특정 이용자를 차단하면 그 사람의 리뷰가 보이지 않는다","API",0],
      ["05","차단 관리","마이페이지에서 차단 목록 확인 및 해제","화면",0]],
   n:"<b>운영</b> · 신고·차단은 Google Play 이용자 제작 콘텐츠 정책 요건을 충족하기 위해 구현했다. 계정 삭제 시 관련 데이터도 함께 정리된다."},
};
const KIND = {0:"", 1:"dat"};
function render(key){
  const f = FLOWS[key];
  document.getElementById('t').textContent = f.t;
  document.getElementById('u').textContent = f.u;
  document.getElementById('n').innerHTML = f.n;
  const r = document.getElementById('r'); r.innerHTML = '';
  f.s.forEach((s,i)=>{
    if(i) { const a=document.createElement('div'); a.className='arw'; a.textContent='→'; r.appendChild(a); }
    const d=document.createElement('div'); d.className='step';
    const cls = i===0 ? 'card act' : (s[4]===1 ? 'card dat' : 'card');
    d.innerHTML = `<div class="${cls}"><div class="no">STEP ${s[0]}</div>`+
      `<div class="nm">${s[1]}</div><div class="ds">${s[2]}</div><div class="tag">${s[3]}</div></div>`;
    r.appendChild(d);
  });
}
window.render = render;
render(new URLSearchParams(location.search).get('f') || 'f1');
</script></body></html>
