spring:
  application:
    name: byeori-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/byeori}
    username: ${POSTGRES_USER:byeori}
    password: ${POSTGRES_PASSWORD:byeori}
  jpa:
    hibernate:
      ddl-auto: none          # 스키마는 Flyway가 관리
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB      # 업로드 1장 최대
      max-request-size: 32MB   # 다중 업로드 대비 요청 전체 한도

# 외부 실데이터 동기화 키(백엔드 환경변수). 미설정 시 동기화 skip.
byeori:
  sync:
    tourapi-key: ${TOURAPI_KEY:}
    kopis-key: ${KOPIS_KEY:}
  auth:
    jwt-secret: ${JWT_SECRET:}   # 필수. 미설정 시 JwtTokenProvider가 부팅 실패시킴(하드코딩 폴백 금지).
    kakao-rest-key: ${KAKAO_REST_KEY:}
    kakao-redirect-uri: ${KAKAO_REDIRECT_URI:}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    # 아이디/비밀번호 로그인용 관리자 계정(운영은 ADMIN_* 환경변수로 덮어쓸 것)
    admin-id: ${ADMIN_ID:admin}
    admin-password: ${ADMIN_PASSWORD:byeori1234}
  maps:
    # 카카오모빌리티 길찾기(여러 경유지) REST 키 — 로그인 키와 동일 값 재사용. 서버 전용.
    kakao-rest-key: ${KAKAO_REST_KEY:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
