spring:
  application:
    name: byeori-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/byeori}
    username: ${POSTGRES_USER:byeori}
    password: ${POSTGRES_PASSWORD:byeori}
  jpa:
    hibernate:
      ddl-auto: none          # 스키마는 Flyway가 관리
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB      # 업로드 1장 최대
      max-request-size: 32MB   # 다중 업로드 대비 요청 전체 한도

# 외부 실데이터 동기화 키(백엔드 환경변수). 미설정 시 동기화 skip.
byeori:
  sync:
    tourapi-key: ${TOURAPI_KEY:}
    kopis-key: ${KOPIS_KEY:}
    seoul-key: ${SEOUL_OPEN_API_KEY:}   # 서울 열린데이터광장 (전통 테마 문화행사)
  route:
    # 도보 경로 서버. 도커 내부망 이름이라 로컬 실행 시에는 127.0.0.1:5000 으로 덮는다.
    osrm-url: ${OSRM_URL:http://osrm:5000}
    # 이 거리(직선, m) 이내면 걷는 것으로 본다. 실제 루트 구간의 중앙값이 706m 다.
    walk-threshold-m: ${WALK_THRESHOLD_M:1000}
  auth:
    jwt-secret: ${JWT_SECRET:}   # 필수. 미설정 시 JwtTokenProvider가 부팅 실패시킴(하드코딩 폴백 금지).
    kakao-rest-key: ${KAKAO_REST_KEY:}
    kakao-redirect-uri: ${KAKAO_REDIRECT_URI:}
    kakao-client-secret: ${KAKAO_CLIENT_SECRET:}   # 콘솔에서 Client Secret 사용 시 필수(없으면 KOE010)
    # 웹·Android 클라이언트를 쉼표로 나열. 기존 단일 설정(GOOGLE_CLIENT_ID)도 그대로 동작한다.
    google-client-ids: ${GOOGLE_CLIENT_IDS:${GOOGLE_CLIENT_ID:}}
    # 웹 인가 코드를 토큰으로 교환할 때 쓰는 '웹' 클라이언트. 시크릿과 짝이어야 한다.
    google-web-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
    # 아이디/비밀번호 로그인용 관리자 계정(운영은 ADMIN_* 환경변수로 덮어쓸 것)
    admin-id: ${ADMIN_ID:admin}
    admin-password: ${ADMIN_PASSWORD:byeori1234}
    # 스토어 심사용 계정(role=USER). 기본값 없음 — 미설정 시 심사 로그인 경로 비활성.
    review-id: ${REVIEW_ID:}
    review-password: ${REVIEW_PASSWORD:}
  maps:
    # 지도/로컬·카카오모빌리티용 REST 키. 서버 전용.
    #
    # 로그인 키와 **따로 받는다.** 카카오맵 무료 쿼터는 개발자 계정에서 '첫 번째로 활성화한
    # 앱'에만 주어지는데, 그 앱이 로그인에 쓰는 앱과 다를 수 있기 때문이다. 로그인은 앱에
    # 등록된 Redirect URI 와 짝이라 키를 바꾸면 깨진다.
    #
    # KAKAO_MAP_REST_KEY 를 주지 않으면 예전처럼 KAKAO_REST_KEY 를 쓴다 — 두 앱이 같은
    # 곳이면 아무것도 설정하지 않아도 그대로 동작한다.
    kakao-rest-key: ${KAKAO_MAP_REST_KEY:${KAKAO_REST_KEY:}}
  ai:
    # AI 루트 생성. 키가 비어 있으면 기능 자체가 꺼진다(앱은 버튼을 숨긴다). 서버 전용.
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    # 비용 상한: 사용자당 하루, 서비스 전체 하루 생성 횟수
    daily-limit-per-user: ${AI_DAILY_LIMIT_PER_USER:10}
    daily-limit-total: ${AI_DAILY_LIMIT_TOTAL:300}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
