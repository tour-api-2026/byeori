name: Store Release (Play · 비공개 테스트)

# git tag v* 를 밀면 production 빌드 → Play 비공개 테스트 트랙 제출까지 한 번에 간다.
# 평소 커밋은 ota-update.yml이 OTA로 내보내고(branches: [main]), 이 워크플로는 태그에만
# 걸리므로 서로 겹치지 않는다.
#
# 프로덕션 트랙 승격은 일부러 자동화하지 않는다 — 되돌릴 수 없는 공개 출시가 태그 하나로
# 나가지 않도록, 테스트 트랙까지만 올리고 승격은 Play Console에서 사람이 누른다.
#
# **OTA 는 Play 의 업데이트 이력에 남지 않는다.** Play 가 세는 것은 트랙에 올라간 AAB 의
# versionCode 뿐이고, OTA 는 JS 번들만 바꾸므로 Play 는 그 존재를 모른다. 14일 비공개 테스트
# 요건(기간 내 업데이트 2회 이상)을 채우려면 반드시 이 워크플로를 돌려야 한다.
# 자세한 순서는 docs/release/closed-testing.md 를 본다.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      submit:
        description: 'Play 제출까지 수행 (false면 빌드까지만 — 파이프라인 점검용)'
        type: boolean
        default: false
      build_id:
        description: '이미 끝난 빌드를 제출만 재시도 (EAS build id). 비우면 새로 빌드한다.'
        type: string
        default: ''

# versionCode는 되돌릴 수 없다. 두 릴리스가 동시에 돌지 않게 직렬화하고,
# 진행 중인 빌드를 취소하지도 않는다(취소해도 올라간 versionCode는 돌아오지 않음).
concurrency:
  group: store-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/app/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # 시크릿 미등록 시 뒤 스텝들이 알 수 없는 에러로 죽지 않도록 인증을 먼저 검사
      - name: Verify EAS auth
        run: |
          if ! eas whoami > /dev/null 2>&1; then
            echo "::error::EAS 인증 실패 — GitHub 시크릿 EXPO_TOKEN이 등록되어 있는지 확인하세요 (expo.dev → Access Tokens)."
            exit 1
          fi

      # 태그 push면 제출까지, 수동 실행이면 입력값에 따른다.
      # build_id 를 줬다면 제출만 하는 것이므로 제출은 당연히 켠다.
      - name: Decide mode
        id: mode
        run: |
          if [ -n "${{ inputs.build_id }}" ]; then
            echo "submit=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "submit=true" >> "$GITHUB_OUTPUT"
          else
            echo "submit=${{ inputs.submit }}" >> "$GITHUB_OUTPUT"
          fi

      # 태그와 app.json version이 어긋나면 스토어에 엉뚱한 버전명으로 올라가고,
      # 그때 쓰인 versionCode는 되돌릴 수 없다. 빌드 전에 막는 편이 싸다.
      #
      # 같은 버전명으로 여러 번 낼 때는 태그에 +N 을 붙인다(v1.0.0+8, v1.0.0+9). 아래에서
      # +뒤를 떼고 비교하므로 검사를 통과하면서 태그는 서로 겹치지 않는다. app.json 의
      # version 을 올리는 쪽은 피한다 — runtimeVersion 이 fingerprint 정책이라 version 을
      # 바꾸면 런타임 버전이 갈리고, 이미 깔린 앱이 OTA 를 더 받지 못한다.
      - name: Tag ↔ version check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          RAW="${GITHUB_REF_NAME#v}"
          RAW="${RAW%%+*}"                  # v1.3.0+7  → 1.3.0 (versionCode 병기 제거)
          TAG_VERSION="${RAW%%-*}"          # v1.3.0-rc1 → 1.3.0 (프리릴리스 꼬리 제거)
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          echo "tag=$TAG_VERSION app.json=$APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::태그($TAG_VERSION)와 app.json version($APP_VERSION)이 다릅니다. 같은 버전명으로 또 내려면 v$APP_VERSION+N 처럼 +N 을 붙이세요(app.json version 을 올리면 OTA 가 끊깁니다)."
            exit 1
          fi

      # eas.json submit 프로필이 ./play-service-account.json 을 가리킨다.
      # 시크릿에서 받아 파일로 떨어뜨리고, 잡이 끝나면 지운다.
      - name: Write Play service account key
        if: steps.mode.outputs.submit == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GitHub 시크릿 PLAY_SERVICE_ACCOUNT_JSON이 없습니다 (Google Cloud 서비스 계정 JSON 전문)."
            exit 1
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > play-service-account.json
          # 키가 깨져 있으면 빌드를 20분 태운 뒤 제출 단계에서 죽는다. 여기서 먼저 검사한다.
          node -e "const k=require('./play-service-account.json'); if (!k.client_email || !k.private_key) throw new Error('client_email / private_key 가 없습니다');" \
            || { echo "::error::서비스 계정 JSON 형식이 올바르지 않습니다 — 시크릿에 JSON 전문이 그대로 들어갔는지 확인하세요."; exit 1; }

      # build_id 를 주면 빌드를 건너뛰고 그 빌드를 제출만 한다.
      #
      # Play 권한이 틀려 제출만 실패하는 일이 실제로 있었다(빌드는 성공, 제출에서 거절).
      # 그때 다시 빌드하면 20분을 또 쓰고 versionCode 를 하나 더 태운다 — 그 번호는
      # 돌아오지 않는다. 이미 만들어진 AAB 를 그대로 다시 제출하는 길을 둔다.
      - name: Build (+ submit)
        run: |
          if [ -n "${{ inputs.build_id }}" ]; then
            echo "::notice::build_id 가 주어져 빌드를 건너뛰고 제출만 합니다."
            eas submit --platform android --profile production \
              --id "${{ inputs.build_id }}" --non-interactive
          elif [ "${{ steps.mode.outputs.submit }}" = "true" ]; then
            eas build --platform android --profile production --auto-submit --non-interactive --wait
          else
            echo "::notice::submit=false — 빌드까지만 수행합니다(파이프라인 점검)."
            eas build --platform android --profile production --non-interactive --wait
          fi

      - name: Remove service account key
        if: always()
        run: rm -f play-service-account.json

      - name: Summary
        if: success()
        run: |
          VC=$(eas build:version:get --platform android --non-interactive 2>/dev/null | sed -n 's/.*versionCode - //p')
          # 트랙은 eas.json에서 읽는다. 여기 적어 두면 설정과 어긋나도 알 수 없다.
          TRACK=$(node -p "require('./eas.json').submit.production.android.track")
          {
            echo "## 스토어 릴리스"
            echo
            echo "- 트리거: \`$GITHUB_EVENT_NAME\` (\`$GITHUB_REF_NAME\`)"
            echo "- version: \`$(node -p "require('./app.json').expo.version")\`"
            echo "- versionCode: \`${VC:-확인 실패}\`"
            echo "- Play 제출: \`${{ steps.mode.outputs.submit }}\` (트랙: \`$TRACK\`)"
            echo
            echo "Play Console에서 **이 트랙이 테스터가 받는 트랙과 같은지** 확인하세요."
            echo "alpha = 비공개 테스트, internal = 내부 테스트입니다. 다르면 테스터에게 가지 않고"
            echo "업데이트 이력에도 잡히지 않습니다."
            echo
            echo "프로덕션 트랙 승격은 Play Console에서 수동으로 진행합니다."
          } >> "$GITHUB_STEP_SUMMARY"
